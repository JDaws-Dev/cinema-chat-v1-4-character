<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <base href="/backrooms/">
    <title>Backrooms</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin: 0; background: #000; }
      #control-hint {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.55); color: #d4c97a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center; padding: 24px; z-index: 50;
      }
      #control-hint .box { max-width: 320px; line-height: 1.5; }
      #control-hint h2 { font-size: 18px; margin: 0 0 12px; letter-spacing: 0.05em; }
      #control-hint p { font-size: 14px; margin: 4px 0; opacity: 0.85; }
      #control-hint button {
        margin-top: 18px; padding: 10px 22px; background: #d4c97a; color: #1a1505;
        border: 0; border-radius: 4px; font-weight: 600; font-size: 14px;
        letter-spacing: 0.1em; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="control-hint">
      <div class="box">
        <h2>THE BACKROOMS</h2>
        <p id="hint-desktop">WASD — move<br>Mouse — look<br>Shift — sprint · Space — jump<br>Esc — release cursor</p>
        <p id="hint-mobile" style="display:none">Drag <b>left half</b> to walk<br>Drag <b>right half</b> to look<br>Tap right half to jump<br>Push joystick to edge to sprint</p>
        <button id="hint-start">ENTER</button>
      </div>
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Backrooms</div>
      </div>
    </div>
    <script>
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var isEmbedded = new URLSearchParams(location.search).get("embedded") === "1";
      if (isMobile) {
        document.getElementById("hint-desktop").style.display = "none";
        document.getElementById("hint-mobile").style.display = "block";
      }
      if (isEmbedded) {
        // FNV already showed a transition; skip the intro card on standalone load
        document.getElementById("control-hint").style.display = "none";
      }

      var __pendingUnity = null;
      function unlockUnityAudio() {
        try {
          var m = __pendingUnity && __pendingUnity.Module;
          if (!m) return;
          var ctx = (m.WEBAudio && m.WEBAudio.audioContext) ||
                    (m.WebAudio && m.WebAudio.audioContext) ||
                    (m.SDL2 && m.SDL2.audio && m.SDL2.audio.audioContext);
          if (ctx && ctx.state !== "running" && typeof ctx.resume === "function") ctx.resume();
        } catch (e) {}
      }
      document.getElementById("hint-start").addEventListener("click", function () {
        document.getElementById("control-hint").style.display = "none";
        unlockUnityAudio();
        if (__pendingUnity && isMobile && !isEmbedded) {
          try { __pendingUnity.SetFullscreen(1); } catch (e) {}
        }
      });
      document.addEventListener("pointerdown", unlockUnityAudio, { passive: true });

      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/backrooms.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/backrooms.data.unityweb",
        frameworkUrl: buildUrl + "/backrooms.framework.js.unityweb",
        codeUrl: buildUrl + "/backrooms.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FridayNightVideo",
        productName: "Backrooms",
        productVersion: "0.1.0",
      };

      if (isMobile) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else if (!isEmbedded) {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      } else {
        // Embedded desktop: fill the iframe
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        document.querySelector("#unity-container").style.cssText = "position:fixed;inset:0;width:100%;height:100%;";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => unityInstance.SetFullscreen(1);
          __pendingUnity = unityInstance;
          if (isEmbedded) unlockUnityAudio();
        }).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
